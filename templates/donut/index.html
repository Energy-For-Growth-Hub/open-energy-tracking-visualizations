<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Senegal MTF Tier Donut Chart</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: white;
      color: #2E5C73;
      overflow-x: hidden;
    }

    .controls {
    max-width: 900px;
    margin: 16px auto 4px;
    padding-left: 90px;
    box-sizing: border-box;
    font-size: 16px;
    color: #2E5C73;
    }

    select {
      padding: 4px 8px;
      font-size: 16px;
      margin-left: 6px;
      color: #2E5C73;
      border: 1px solid #aaa;
      border-radius: 4px;
    }

    .chart-title {
      display: none;
    }

    svg {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .legend text {
      font-size: 15px;
      fill: #2E5C73;
    }

    .legend-title {
      font-size: 17px;
      font-weight: 700;
      fill: #2E5C73;
    }

    .legend-subtitle {
      font-size: 13px;
      fill: #2E5C73;
    }

    .slice-label {
      font-size: 16px;
      font-weight: 700;
      fill: white;
      pointer-events: none;
    }

    .leader-line {
      fill: none;
      stroke: #9fb3bd;
      stroke-width: 1;
    }

    .slice-label.outside {
      fill: #2E5C73;
    }

    .tooltip {
      position: absolute;
      background: white;
      border: 1px solid #ccc;
      padding: 8px 10px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      color: #2E5C73;
    }

    .source {
      max-width: 900px;
      margin: 0 auto 12px;
      padding: 0 16px 0 90px;
      box-sizing: border-box;
      font-size: 13px;
      line-height: 1.4;
      color: #2E5C73;
      text-align: left;
    }

    .source a {
      color: #2E5C73;
    }

    @media (max-width: 560px) {
      .controls {
        margin-top: 12px;
        margin-bottom: 4px;
        padding-left: 16px;
        font-size: 14px;
      }

      select {
        font-size: 14px;
      }

      .source {
        margin-top: 0;
        padding-left: 16px;
      }
    }

  </style>
</head>

<body>

<h2 class="chart-title">Senegal</h2>

<div class="controls">
  Year:
  <select id="year-select"></select>
</div>

<svg width="900" height="520" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"></svg>

<div class="source">
  Source: <a href="https://openenergymaps.org/" target="_blank" rel="noopener noreferrer">Open Energy Maps</a> / Energy for Growth Hub.
</div>

<div class="tooltip"></div>

<script src="script.js"></script>

</body>
</html>
