<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MTF Tier Slope Chart</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: white;
      color: #2E5C73;
      overflow-x: hidden;
    }

    .chart-title {
      display: none;
    }

    .chart-module {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 12px 8px 8px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 250px minmax(560px, 1fr) 152px;
      gap: 12px;
      align-items: stretch;
    }

    .info-panel {
      background: #f3f7f9;
      border: 1px solid #e1ebef;
      border-radius: 8px;
      padding: 20px 18px;
      box-sizing: border-box;
      color: #2E5C73;
      display: flex;
      flex-direction: column;
      min-height: 520px;
    }

    .controls {
      display: grid;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #2E5C73;
    }

    .controls span {
      display: block;
    }

    select {
      width: 100%;
      padding: 7px 10px;
      font-size: 14px;
      color: #2E5C73;
      border: 1px solid #b7c6cc;
      border-radius: 4px;
      background: white;
      box-sizing: border-box;
    }

    .panel-divider {
      height: 1px;
      margin: 20px 0;
      background: #dbe7eb;
      flex: 0 0 auto;
    }

    .legend-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .legend-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      line-height: 1.25;
      color: #2E5C73;
    }

    .legend-swatch {
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
    }

    .source {
      margin-top: auto;
      font-size: 11px;
      line-height: 1.45;
      color: #2E5C73;
      text-align: left;
    }

    .source a {
      color: #2E5C73;
    }

    .chart-area {
      background: white;
      border: 1px solid #e6eef2;
      border-radius: 8px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 520px;
      padding: 0 8px;
    }

    svg {
      width: 100%;
      max-width: 600px;
      height: 520px;
      display: block;
    }

    .year-label {
      font-size: 22px;
      font-weight: 800;
      fill: #2E5C73;
    }

    .value-label {
      font-size: 17px;
      font-weight: 800;
      fill: #2E5C73;
    }

    .guide-line {
      stroke: #b7c6cc;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }

    .slope-line {
      stroke-width: 5;
      stroke-linecap: round;
    }

    .slope-point {
      stroke: white;
      stroke-width: 2;
    }

    .change-panel {
      background: white;
      border: 1px solid #e6eef2;
      border-radius: 8px;
      box-sizing: border-box;
      min-height: 520px;
      padding: 18px 10px;
      color: #2E5C73;
      display: flex;
      flex-direction: column;
    }

    .change-heading {
      text-align: center;
      margin-bottom: 18px;
    }

    .change-title {
      display: block;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.05;
    }

    .change-subtitle {
      display: block;
      margin-top: 3px;
      font-size: 14px;
      line-height: 1.2;
    }

    .change-list {
      display: grid;
      grid-template-rows: repeat(5, 56px);
      gap: 18px;
      margin-top: 48px;
    }

    .change-card {
      height: 56px;
      border: 1px solid #d6e0e4;
      border-radius: 8px;
      background: white;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      align-self: center;
      min-width: 0;
    }

    .change-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 38px;
      font-size: 26px;
      font-weight: 800;
      line-height: 1;
    }

    .change-value {
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .download-row {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 0 8px 12px;
      box-sizing: border-box;
      display: flex;
      justify-content: flex-end;
    }

    .download-button {
      border: 1px solid #b7c6cc;
      border-radius: 4px;
      background: white;
      color: #2E5C73;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 12px;
      cursor: pointer;
    }

    .download-button:hover {
      background: #f3f7f9;
    }

    @media (max-width: 1040px) {
      .chart-module {
        grid-template-columns: 1fr;
      }

      .info-panel,
      .chart-area,
      .change-panel {
        min-height: 0;
      }

      .source {
        margin-top: 0;
      }

      svg {
        height: auto;
        aspect-ratio: 600 / 520;
      }

      .change-list {
        grid-template-columns: repeat(5, minmax(120px, 1fr));
        grid-template-rows: none;
        gap: 10px;
        margin-top: 0;
      }

      .change-card {
        width: 100%;
      }
    }

    @media (max-width: 680px) {
      .chart-module {
        padding: 8px;
      }

      .chart-area {
        padding: 0;
        overflow-x: auto;
        justify-content: flex-start;
      }

      svg {
        width: 600px;
        min-width: 600px;
        height: 520px;
      }

      .change-list {
        grid-template-columns: 1fr;
      }

      .download-row {
        justify-content: stretch;
      }

      .download-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<h2 class="chart-title"></h2>

<div class="chart-module">
  <aside class="info-panel">
    <div class="controls">
      <span>Compare</span>
      <select id="start-year" aria-label="Start year"></select>
      <span>to</span>
      <select id="end-year" aria-label="End year"></select>
    </div>

    <div class="panel-divider"></div>

    <ul class="legend-list">
      <li><span class="legend-swatch" style="background: #d73027;"></span>Tier 0/1 (0.9 kWh)</li>
      <li><span class="legend-swatch" style="background: #f46d43;"></span>Tier 2 (14.6 kWh)</li>
      <li><span class="legend-swatch" style="background: #f2cf63;"></span>Tier 3 (73 kWh)</li>
      <li><span class="legend-swatch" style="background: #8fd05a;"></span>Tier 4 (250 kWh)</li>
      <li><span class="legend-swatch" style="background: #1f9448;"></span>Tier 5 (600+ kWh)</li>
    </ul>

    <div class="panel-divider"></div>

    <div class="source">
      Source: <a href="https://openenergymaps.org/" target="_blank" rel="noopener noreferrer">Open Energy Maps</a> / Energy for Growth Hub.
    </div>
  </aside>

  <div class="chart-area">
    <svg id="slope-chart" width="600" height="520" viewBox="0 0 600 520" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <aside class="change-panel" aria-live="polite">
    <div class="change-heading">
      <span class="change-title">Change</span>
      <span class="change-subtitle">(people)</span>
    </div>
    <div class="change-list"></div>
  </aside>
</div>

<div class="download-row">
  <button class="download-button" id="download-chart" type="button">Download SVG</button>
</div>

<script src="script.js"></script>

</body>
</html>
