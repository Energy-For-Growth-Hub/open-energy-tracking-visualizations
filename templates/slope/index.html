<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Senegal Slope Chart</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: white;
      color: #2E5C73;
    }

    .chart-title {
      margin-left: 48px;
      margin-top: 24px;
      margin-bottom: 10px;
      font-size: 44px;
      font-weight: 800;
      color: #2E5C73;
    }

    .controls {
      margin-left: 48px;
      margin-bottom: 8px;
      font-size: 18px;
      color: #2E5C73;
    }

    select {
      margin: 0 8px;
      padding: 6px 12px;
      font-size: 16px;
      color: #2E5C73;
      border: 1px solid #b7c6cc;
      border-radius: 4px;
      background: white;
    }

    svg {
      width: 780px;
      height: 560px;
      display: block;
    }

    .year-label {
      font-size: 22px;
      font-weight: 800;
      fill: #2E5C73;
    }

    .tier-label {
      font-size: 20px;
      font-weight: 800;
      fill: #2E5C73;
    }

    .value-label {
      font-size: 20px;
      font-weight: 800;
      fill: #2E5C73;
    }

    .change-title {
      font-size: 22px;
      font-weight: 800;
      fill: #2E5C73;
    }

    .change-subtitle {
      font-size: 14px;
      fill: #2E5C73;
    }

    .change-card {
      fill: white;
      stroke: #d6e0e4;
      stroke-width: 1;
      rx: 10;
      ry: 10;
    }

    .change-text {
      font-size: 22px;
      font-weight: 800;
    }

    .change-icon {
      font-size: 30px;
      font-weight: 1000;
      fill: white;
    }

    .guide-line {
      stroke: #b7c6cc;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }
  </style>
</head>

<body>

<h2 class="chart-title">Senegal</h2>

<div class="controls">
  Compare:
  <select id="start-year"></select>
  to
  <select id="end-year"></select>
</div>

<svg width="780" height="560"></svg>

<script src="script.js"></script>

</body>
</html>
